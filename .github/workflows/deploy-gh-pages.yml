# Deploy to GitHub Pages
#
# After merging to main:
# 1. Repo Settings > Pages > Build and deployment > Source: GitHub Actions
# 2. Repo Settings > Pages > Custom domain: breadandcircuses.xyz (then Enforce HTTPS)
# 3. Production URL: https://breadandcircuses.xyz/
# 4. Staging URL https://tastethesoup.github.io/bread-and-circuses/ may redirect
#    once the custom domain is set.
#
# This workflow publishes a CNAME file in the built site. GitHub Actions Pages
# still needs the custom domain entered in Settings. DNS at Squarespace is not
# changed by this repo; see README.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
